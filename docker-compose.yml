version: '3.8'

services:
  ai-platform:
    build: .
    container_name: ai_multi_module_platform
    ports:
      - "8501:8501"
    volumes:
      - ./user_feedback.json:/app/user_feedback.json
      - ./downloads:/app/downloads
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
